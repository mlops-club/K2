# TEST ONLY: what the lab's runner pod (scripts/kind/fleet-g2.sh) needs in
# k2-kind-dist-fake. The pod itself is made per run, with one HOME volume
# per host, by scripts/kind/fleet_kind.py.
#
# The controller by pod address, ready or not (its Service k2-controller
# lists ready pods only): the runner's 127.0.0.1 forward waits for a
# booting or held controller the way a client waits for a refused port.
apiVersion: v1
kind: Service
metadata:
  name: k2-lab-controller
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: k2-controller
  ports:
    - {name: api, port: 7420}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k2-lab-runner
---
# Chaos and the S6 to S9 restarts: exec into a pod (kill a daemon or an
# agent CLI, list processes), delete a pod (--kill=pod), read pods. This
# namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k2-lab-runner
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, delete]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create, get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k2-lab-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: k2-lab-runner
subjects:
  - kind: ServiceAccount
    name: k2-lab-runner
