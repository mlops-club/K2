# The Mac's door: scripts/kind/up.sh runs k2-kind-proxy (deploy/kind/proxy),
# 127.0.0.1:7440 → any node:30740 → this Service → the pod. Same spec as the
# Service the coordinator created by hand on 2026-10-24.
apiVersion: v1
kind: Service
metadata:
  name: k2-solo-nodeport
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: k2-solo
  ports:
    - {port: 7420, targetPort: 7420, nodePort: 30740}
